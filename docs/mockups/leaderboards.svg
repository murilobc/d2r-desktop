  <text x="800" y="120" fill="#a0a0a0" font-size="12" font-weight="bold">Date</text>
  <!-- Row 1 -->
  <text x="270" y="148" fill="#eaeaea" font-size="13">Fastest Run</text>
  <text x="430" y="148" fill="#4ecdc4" font-size="13" font-weight="bold">1m 23s</text>
