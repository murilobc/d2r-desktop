  <text x="700" y="285" fill="#a0a0a0" font-size="12" font-weight="bold">Last Month</text>
  <text x="900" y="285" fill="#a0a0a0" font-size="12" font-weight="bold">Change</text>
  <text x="270" y="315" fill="#eaeaea" font-size="13">Total Runs</text>
  <text x="500" y="315" fill="#eaeaea" font-size="13">142</text>
  <text x="700" y="315" fill="#eaeaea" font-size="13">118</text>
  <text x="900" y="315" fill="#4caf50" font-size="13">+20.3%</text>
  <text x="270" y="338" fill="#eaeaea" font-size="13">Items/Hour</text>
  <text x="500" y="338" fill="#eaeaea" font-size="13">12.8</text>
  <text x="700" y="338" fill="#eaeaea" font-size="13">10.4</text>
  <text x="900" y="338" fill="#4caf50" font-size="13">+23.1%</text>
  <text x="270" y="361" fill="#eaeaea" font-size="13">Fastest Run</text>
  <text x="500" y="361" fill="#eaeaea" font-size="13">1m 23s</text>
  <text x="700" y="361" fill="#eaeaea" font-size="13">1m 45s</text>
  <text x="900" y="361" fill="#4caf50" font-size="13">-21.0%</text>
