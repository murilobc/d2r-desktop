  <text x="800" y="148" fill="#a0a0a0" font-size="12">2026-07-20</text>
  <!-- Row 2 -->
  <text x="270" y="170" fill="#eaeaea" font-size="13">Best Items/Run</text>
  <text x="430" y="170" fill="#ffd700" font-size="13" font-weight="bold">7 items</text>
