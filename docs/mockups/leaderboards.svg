  <text x="250" y="50" fill="#eaeaea" font-size="22" font-weight="bold">⊞ Leaderboards</text>
  <rect x="800" y="28" width="175" height="28" rx="4" fill="#0f3460" stroke="#2a2a4a"/>
  <text x="815" y="47" fill="#eaeaea" font-size="12">MFSorc · Sorceress</text>
  <!-- Personal Bests Section -->
  <text x="250" y="90" fill="#eaeaea" font-size="16" font-weight="bold">Personal Bests</text>
  <rect x="250" y="100" width="815" height="130" rx="8" fill="#16213e" stroke="#2a2a4a"/>
