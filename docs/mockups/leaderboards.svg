  <text x="250" y="522" fill="#eaeaea" font-size="16" font-weight="bold">Export</text>
  <rect x="250" y="530" width="815" height="70" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <rect x="270" y="548" width="200" height="32" rx="4" fill="#e94560"/>
  <text x="300" y="569" fill="white" font-size="13">◫ Export Share Card (PNG)</text>
  <rect x="490" y="548" width="200" height="32" rx="4" fill="#0f3460" stroke="#e94560"/>
  <text x="520" y="569" fill="#eaeaea" font-size="13">↓ Export Community JSON</text>
