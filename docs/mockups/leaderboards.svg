  <text x="270" y="429" fill="#a0a0a0" font-size="12" font-weight="bold">Season</text>
  <text x="460" y="429" fill="#a0a0a0" font-size="12" font-weight="bold">Date Range</text>
  <text x="660" y="429" fill="#a0a0a0" font-size="12" font-weight="bold">Fastest</text>
  <text x="780" y="429" fill="#a0a0a0" font-size="12" font-weight="bold">Best Items</text>
  <text x="940" y="429" fill="#a0a0a0" font-size="12" font-weight="bold">Best /hr</text>
  <text x="270" y="456" fill="#eaeaea" font-size="13">Season 13 Ladder</text>
  <text x="460" y="456" fill="#a0a0a0" font-size="12">2026-01-01 — 2026-06-30</text>
  <text x="660" y="456" fill="#4ecdc4" font-size="12">1m 31s</text>
  <text x="780" y="456" fill="#eaeaea" font-size="12">6</text>
  <text x="940" y="456" fill="#eaeaea" font-size="12">15.2/hr</text>
  <text x="270" y="475" fill="#eaeaea" font-size="13">Season 12 Ladder</text>
  <text x="460" y="475" fill="#a0a0a0" font-size="12">2025-07-01 — 2025-12-31</text>
  <text x="660" y="475" fill="#4ecdc4" font-size="12">1m 48s</text>
  <text x="780" y="475" fill="#eaeaea" font-size="12">5</text>
  <text x="940" y="475" fill="#eaeaea" font-size="12">12.7/hr</text>
