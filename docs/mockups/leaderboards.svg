  <text x="20" y="115" fill="#eaeaea" font-size="13" opacity="0.6">▶ Run Tracker</text>
  <text x="20" y="145" fill="#eaeaea" font-size="13" opacity="0.6">☰ History</text>
  <text x="20" y="175" fill="#eaeaea" font-size="13" opacity="0.6">◈ Statistics</text>
  <text x="20" y="205" fill="#eaeaea" font-size="13" opacity="0.6">※ DClone</text>
  <text x="20" y="235" fill="#eaeaea" font-size="13" opacity="0.6">★ Achievements</text>
  <rect x="0" y="250" width="220" height="30" fill="rgba(233,69,96,0.2)"/>
