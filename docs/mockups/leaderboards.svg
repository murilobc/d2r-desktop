  <text x="800" y="192" fill="#a0a0a0" font-size="12">2026-07-15</text>
  <!-- Row 4 -->
  <text x="270" y="214" fill="#eaeaea" font-size="13">Longest Run</text>
  <text x="430" y="214" fill="#a0a0a0" font-size="13">12m 07s</text>
  <text x="580" y="214" fill="#eaeaea" font-size="13">Travincal</text>
  <text x="800" y="214" fill="#a0a0a0" font-size="12">2026-07-12</text>
