  <text x="800" y="170" fill="#a0a0a0" font-size="12">2026-07-18</text>
  <!-- Row 3 -->
  <text x="270" y="192" fill="#eaeaea" font-size="13">Best Items/Hour</text>
  <text x="430" y="192" fill="#ff8c00" font-size="13" font-weight="bold">18.4/hr</text>
