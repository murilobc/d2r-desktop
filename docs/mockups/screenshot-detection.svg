<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- Background -->
  <rect width="1100" height="780" fill="#1a1a2e"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="780" fill="#0f3460"/>
  <text x="20" y="38" fill="#e94560" font-size="16" font-weight="bold">D2R Tracker</text>
  <line x1="0" y1="60" x2="220" y2="60" stroke="#2a2a4a" stroke-width="1"/>
  <text x="20" y="85" fill="#eaeaea" font-size="13" opacity="0.6">◎ Profiles</text>
  <text x="20" y="115" fill="#eaeaea" font-size="13" opacity="0.6">▶ Run Tracker</text>
  <text x="20" y="145" fill="#eaeaea" font-size="13" opacity="0.6">↗ Routes</text>
  <text x="20" y="175" fill="#eaeaea" font-size="13" opacity="0.6">☰ History</text>
  <text x="20" y="205" fill="#eaeaea" font-size="13" opacity="0.6">◈ Statistics</text>
  <line x1="10" y1="230" x2="210" y2="230" stroke="#2a2a4a" stroke-width="1"/>
  <rect x="0" y="240" width="220" height="30" fill="rgba(233,69,96,0.2)"/>
  <rect x="0" y="240" width="3" height="30" fill="#e94560"/>
  <text x="20" y="260" fill="#eaeaea" font-size="13">⚙ Settings</text>

  <!-- Main content -->
  <text x="250" y="50" fill="#eaeaea" font-size="22" font-weight="bold">Screenshot Item Detection</text>
  <text x="250" y="75" fill="#a0a0a0" font-size="13">Settings → Screenshot Detection</text>

  <!-- Status panel -->
  <rect x="250" y="95" width="810" height="50" rx="6" fill="rgba(78,205,196,0.1)" stroke="#4ecdc4"/>
  <circle cx="275" cy="120" r="6" fill="#4ecdc4"/>
  <text x="290" y="125" fill="#4ecdc4" font-size="13" font-weight="bold">Clipboard + Folder Monitoring Active</text>
  <text x="565" y="125" fill="#a0a0a0" font-size="11">Items detected: 5 | Accuracy: 92% | Session required</text>

  <!-- Settings Section -->
  <rect x="250" y="160" width="395" height="310" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="270" y="190" fill="#eaeaea" font-size="14" font-weight="bold">Detection Settings</text>

  <!-- Toggle: Clipboard -->
  <text x="270" y="225" fill="#eaeaea" font-size="12">Clipboard Monitoring</text>
  <rect x="560" y="212" width="40" height="20" rx="10" fill="#4ecdc4"/>
  <circle cx="590" cy="222" r="8" fill="#fff"/>

  <!-- Toggle: Folder -->
  <text x="270" y="260" fill="#eaeaea" font-size="12">Folder Monitoring</text>
  <rect x="560" y="247" width="40" height="20" rx="10" fill="#4ecdc4"/>
  <circle cx="590" cy="257" r="8" fill="#fff"/>

  <!-- Folder path -->
  <text x="270" y="285" fill="#a0a0a0" font-size="10">Screenshot folder (auto-starts on launch):</text>
  <rect x="270" y="290" width="280" height="24" rx="3" fill="#1a1a2e" stroke="#2a2a4a"/>
  <text x="278" y="306" fill="#eaeaea" font-size="9">Documents\Diablo II Resurrected\Screenshots\</text>
  <rect x="555" y="290" width="60" height="24" rx="3" fill="rgba(78,205,196,0.2)" stroke="#4ecdc4"/>
  <text x="564" y="306" fill="#4ecdc4" font-size="9">Browse</text>

  <!-- Confidence threshold -->
  <text x="270" y="340" fill="#a0a0a0" font-size="11">Confidence Threshold</text>
  <rect x="270" y="348" width="200" height="6" rx="3" fill="#1a1a2e"/>
  <rect x="270" y="348" width="160" height="6" rx="3" fill="#4ecdc4"/>
  <text x="480" y="355" fill="#a0a0a0" font-size="10">80%</text>

  <!-- Keybind setting -->
  <text x="270" y="385" fill="#eaeaea" font-size="12">Detect Screenshot Keybind</text>
  <rect x="270" y="393" width="100" height="24" rx="3" fill="#1a1a2e" stroke="#4ecdc4"/>
  <text x="290" y="409" fill="#4ecdc4" font-size="11">Ctrl+Shift+D</text>
  <text x="380" y="409" fill="#a0a0a0" font-size="9">← toast on failure</text>

  <!-- Supported items -->
  <text x="270" y="440" fill="#a0a0a0" font-size="11">Detection targets:</text>
  <rect x="270" y="446" width="60" height="18" rx="3" fill="rgba(196,160,0,0.2)" stroke="#c4a000"/>
  <text x="280" y="459" fill="#c4a000" font-size="9">Unique</text>
  <rect x="340" y="446" width="45" height="18" rx="3" fill="rgba(0,196,0,0.2)" stroke="#00c400"/>
  <text x="350" y="459" fill="#00c400" font-size="9">Set</text>
  <rect x="395" y="446" width="55" height="18" rx="3" fill="rgba(255,140,0,0.2)" stroke="#ff8c00"/>
  <text x="405" y="459" fill="#ff8c00" font-size="9">Runes</text>

  <!-- Detection Preview -->
  <rect x="660" y="160" width="400" height="200" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="680" y="190" fill="#eaeaea" font-size="14" font-weight="bold">Last Detection</text>
  <text x="890" y="190" fill="#4ecdc4" font-size="10">2 seconds ago</text>

  <!-- Screenshot preview area -->
  <rect x="680" y="205" width="220" height="80" rx="4" fill="#000" stroke="#2a2a4a"/>
  <text x="755" y="235" fill="#c4a000" font-size="14" font-weight="bold" text-anchor="middle">Harlequin Crest</text>
  <text x="755" y="255" fill="#a0a0a0" font-size="10" text-anchor="middle">Shako</text>
  <text x="755" y="275" fill="#666" font-size="9" text-anchor="middle">[Screenshot Crop]</text>

  <!-- Detection result -->
  <text x="920" y="225" fill="#a0a0a0" font-size="10">Detected:</text>
  <text x="920" y="245" fill="#c4a000" font-size="12" font-weight="bold">Shako</text>
  <text x="920" y="265" fill="#a0a0a0" font-size="10">Confidence:</text>
  <text x="920" y="285" fill="#4ecdc4" font-size="12" font-weight="bold">94%</text>

  <!-- Confirm/Reject buttons -->
  <rect x="680" y="300" width="100" height="28" rx="4" fill="#4ecdc4"/>
  <text x="700" y="318" fill="#000" font-size="11" font-weight="bold">✓ Confirm</text>
  <rect x="790" y="300" width="100" height="28" rx="4" fill="none" stroke="#ffaa00"/>
  <text x="812" y="318" fill="#ffaa00" font-size="11">✎ Correct</text>
  <rect x="900" y="300" width="80" height="28" rx="4" fill="none" stroke="#e94560"/>
  <text x="916" y="318" fill="#e94560" font-size="11">✕ Skip</text>

  <!-- Overlay mini-preview -->
  <rect x="660" y="375" width="400" height="95" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="680" y="400" fill="#eaeaea" font-size="14" font-weight="bold">Overlay Detection</text>
  <text x="880" y="400" fill="#a0a0a0" font-size="10">In-game overlay</text>

  <!-- Overlay miniature -->
  <rect x="680" y="410" width="200" height="45" rx="4" fill="rgba(0,0,0,0.5)" stroke="#4ecdc4" stroke-width="0.5"/>
  <text x="692" y="427" fill="#eaeaea" font-size="9">00:04:32.1 · Chaos Sanctuary</text>
  <text x="692" y="442" fill="#a0a0a0" font-size="9">Runs: 12 (247) · Items: 3</text>
  <text x="692" y="452" fill="#4ecdc4" font-size="8">✓ Item detected</text>

  <!-- Overlay features description -->
  <text x="900" y="425" fill="#a0a0a0" font-size="9">• Relays results to main window</text>
  <text x="900" y="440" fill="#a0a0a0" font-size="9">• Shows item count in real-time</text>
  <text x="900" y="455" fill="#a0a0a0" font-size="9">• Session guard on detect button</text>

  <!-- Detection History -->
  <rect x="250" y="485" width="810" height="270" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="270" y="515" fill="#eaeaea" font-size="14" font-weight="bold">Detection History</text>
  <text x="920" y="515" fill="#a0a0a0" font-size="11">This session</text>

  <!-- Session guard notice -->
  <rect x="680" y="498" width="180" height="20" rx="3" fill="rgba(78,205,196,0.1)" stroke="#4ecdc4" stroke-width="0.5"/>
  <text x="690" y="512" fill="#4ecdc4" font-size="9">⚡ Requires active session</text>

  <!-- History table header -->
  <rect x="270" y="525" width="770" height="25" rx="0" fill="rgba(0,0,0,0.3)"/>
  <text x="280" y="542" fill="#a0a0a0" font-size="10" font-weight="bold">TIME</text>
  <text x="360" y="542" fill="#a0a0a0" font-size="10" font-weight="bold">ITEM DETECTED</text>
  <text x="580" y="542" fill="#a0a0a0" font-size="10" font-weight="bold">SOURCE</text>
  <text x="670" y="542" fill="#a0a0a0" font-size="10" font-weight="bold">CONFIDENCE</text>
  <text x="780" y="542" fill="#a0a0a0" font-size="10" font-weight="bold">STATUS</text>
  <text x="920" y="542" fill="#a0a0a0" font-size="10" font-weight="bold">RARITY</text>

  <!-- History rows -->
  <rect x="270" y="555" width="770" height="30" rx="0" fill="rgba(0,0,0,0.1)"/>
  <text x="280" y="574" fill="#eaeaea" font-size="11">19:42</text>
  <text x="360" y="574" fill="#c4a000" font-size="11">Shako (Harlequin Crest)</text>
  <text x="580" y="574" fill="#a0a0a0" font-size="10">Clipboard</text>
  <text x="680" y="574" fill="#4ecdc4" font-size="11">94%</text>
  <text x="780" y="574" fill="#4ecdc4" font-size="11">✓ Confirmed</text>
  <text x="920" y="574" fill="#c4a000" font-size="11">Unique</text>

  <rect x="270" y="590" width="770" height="30" rx="0" fill="rgba(0,0,0,0.05)"/>
  <text x="280" y="609" fill="#eaeaea" font-size="11">19:38</text>
  <text x="360" y="609" fill="#ff8c00" font-size="11">Ist Rune</text>
  <text x="580" y="609" fill="#a0a0a0" font-size="10">Folder</text>
  <text x="680" y="609" fill="#4ecdc4" font-size="11">97%</text>
  <text x="780" y="609" fill="#4ecdc4" font-size="11">✓ Auto-logged</text>
  <text x="920" y="609" fill="#ff8c00" font-size="11">Rune</text>

  <rect x="270" y="625" width="770" height="30" rx="0" fill="rgba(0,0,0,0.1)"/>
  <text x="280" y="644" fill="#eaeaea" font-size="11">19:31</text>
  <text x="360" y="644" fill="#00c400" font-size="11">Tal Rasha's Adjudication</text>
  <text x="580" y="644" fill="#a0a0a0" font-size="10">Overlay</text>
  <text x="680" y="644" fill="#ffaa00" font-size="11">78%</text>
  <text x="780" y="644" fill="#ffaa00" font-size="11">✎ Corrected</text>
  <text x="920" y="644" fill="#00c400" font-size="11">Set</text>

  <rect x="270" y="660" width="770" height="30" rx="0" fill="rgba(0,0,0,0.05)"/>
  <text x="280" y="679" fill="#eaeaea" font-size="11">19:25</text>
  <text x="360" y="679" fill="#c4a000" font-size="11">Arachnid Mesh</text>
  <text x="580" y="679" fill="#a0a0a0" font-size="10">Keybind</text>
  <text x="680" y="679" fill="#4ecdc4" font-size="11">91%</text>
  <text x="780" y="679" fill="#4ecdc4" font-size="11">✓ Confirmed</text>
  <text x="920" y="679" fill="#c4a000" font-size="11">Unique</text>

  <rect x="270" y="695" width="770" height="30" rx="0" fill="rgba(0,0,0,0.1)"/>
  <text x="280" y="714" fill="#eaeaea" font-size="11">19:18</text>
  <text x="360" y="714" fill="#ff8c00" font-size="11">Ber Rune</text>
  <text x="580" y="714" fill="#a0a0a0" font-size="10">Folder</text>
  <text x="680" y="714" fill="#4ecdc4" font-size="11">99%</text>
  <text x="780" y="714" fill="#4ecdc4" font-size="11">✓ Auto-logged</text>
  <text x="920" y="714" fill="#ff8c00" font-size="11">Rune</text>
</svg>
