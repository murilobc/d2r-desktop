<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- Background -->
  <rect width="1100" height="640" fill="#1a1a2e"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="640" fill="#0f3460"/>
  <text x="20" y="38" fill="#e94560" font-size="16" font-weight="bold">D2R Tracker</text>
  <line x1="0" y1="60" x2="220" y2="60" stroke="#2a2a4a" stroke-width="1"/>
  <text x="20" y="85" fill="#eaeaea" font-size="13" opacity="0.6">◎ Profiles</text>
  <text x="20" y="115" fill="#eaeaea" font-size="13" opacity="0.6">▶ Run Tracker</text>
  <text x="20" y="145" fill="#eaeaea" font-size="13" opacity="0.6">☰ History</text>
  <text x="20" y="175" fill="#eaeaea" font-size="13" opacity="0.6">⊞ Leaderboards</text>
  <text x="20" y="205" fill="#eaeaea" font-size="13" opacity="0.6">∇ Terror Zone</text>
  <line x1="10" y1="225" x2="210" y2="225" stroke="#2a2a4a" stroke-width="1"/>
  <rect x="0" y="235" width="220" height="30" fill="rgba(233,69,96,0.2)"/>
  <rect x="0" y="235" width="3" height="30" fill="#e94560"/>
  <text x="20" y="255" fill="#eaeaea" font-size="13">⚙ Settings</text>
  <text x="20" y="285" fill="#eaeaea" font-size="13" opacity="0.6">◳ Overlay</text>
  <text x="20" y="315" fill="#eaeaea" font-size="13" opacity="0.6">◫ Detect Screenshot</text>

  <!-- Main content -->
  <text x="250" y="50" fill="#eaeaea" font-size="22" font-weight="bold">Settings</text>

  <!-- Screenshot Detection Section -->
  <rect x="250" y="65" width="815" height="280" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="270" y="95" fill="#eaeaea" font-size="16" font-weight="bold">Screenshot Detection</text>
  <text x="270" y="115" fill="#a0a0a0" font-size="12">Detects items from clipboard screenshots (PrintScreen). All processing is local — no network calls.</text>

  <!-- Clipboard Monitoring toggle -->
  <text x="270" y="150" fill="#a0a0a0" font-size="12">Clipboard Monitoring</text>
  <rect x="840" y="135" width="80" height="28" rx="14" fill="#4caf50"/>
  <circle cx="906" cy="149" r="12" fill="white"/>
  <text x="876" y="153" fill="white" font-size="12" font-weight="bold">ON</text>

  <!-- Auto-Detection toggle -->
  <text x="270" y="198" fill="#a0a0a0" font-size="12">Auto-Detection</text>
  <text x="270" y="215" fill="#666" font-size="11">Automatically confirms high-confidence matches without user prompt</text>
  <rect x="840" y="183" width="80" height="28" rx="14" fill="#4caf50"/>
  <circle cx="906" cy="197" r="12" fill="white"/>
  <text x="876" y="201" fill="white" font-size="12" font-weight="bold">ON</text>

  <!-- Confidence Threshold -->
  <text x="270" y="255" fill="#a0a0a0" font-size="12">Confidence Threshold</text>
  <rect x="840" y="240" width="80" height="28" rx="4" fill="#1a1a2e" stroke="#2a2a4a"/>
  <text x="862" y="259" fill="#eaeaea" font-size="14">80</text>
  <text x="925" y="259" fill="#a0a0a0" font-size="12">%</text>
  <text x="270" y="275" fill="#666" font-size="11">Items below this threshold are shown as suggestions requiring confirmation</text>

  <text x="270" y="330" fill="#888" font-size="11">All OCR processing is 100% local — no network calls, no external API keys, never reads game process memory.</text>

  <!-- Detection toast preview -->
  <rect x="250" y="370" width="815" height="200" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="270" y="398" fill="#eaeaea" font-size="15" font-weight="bold">How it works</text>

  <!-- Step 1 -->
  <rect x="270" y="410" width="28" height="28" rx="14" fill="#4ecdc4"/>
  <text x="280" y="429" fill="#1a1a2e" font-size="13" font-weight="bold">1</text>
  <text x="310" y="425" fill="#eaeaea" font-size="12">Press PrintScreen while hovering over an item tooltip in D2R</text>
  <text x="310" y="442" fill="#a0a0a0" font-size="11">Screenshot is captured to clipboard automatically</text>

  <!-- Step 2 -->
  <rect x="270" y="460" width="28" height="28" rx="14" fill="#4ecdc4"/>
  <text x="280" y="479" fill="#1a1a2e" font-size="13" font-weight="bold">2</text>
  <text x="310" y="475" fill="#eaeaea" font-size="12">OCR engine detects item name and rarity</text>
  <text x="310" y="492" fill="#a0a0a0" font-size="11">Color detection isolates the tooltip region · Windows native OCR + ocrs fallback</text>

  <!-- Step 3 -->
  <rect x="270" y="510" width="28" height="28" rx="14" fill="#4ecdc4"/>
  <text x="280" y="529" fill="#1a1a2e" font-size="13" font-weight="bold">3</text>
  <text x="310" y="525" fill="#eaeaea" font-size="12">Confirmation dialog appears with matched item</text>
  <text x="310" y="542" fill="#a0a0a0" font-size="11">Confirm to log, or use Change to search manually — requires an active session</text>
</svg>
