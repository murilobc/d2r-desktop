<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- Background -->
  <rect width="1100" height="700" fill="#1a1a2e"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="700" fill="#0f3460"/>
  <text x="20" y="38" fill="#e94560" font-size="16" font-weight="bold">D2R Tracker</text>
  <line x1="0" y1="60" x2="220" y2="60" stroke="#2a2a4a" stroke-width="1"/>
  <text x="20" y="85" fill="#eaeaea" font-size="13" opacity="0.6">◎ Profiles</text>
  <text x="20" y="115" fill="#eaeaea" font-size="13" opacity="0.6">▶ Run Tracker</text>
  <text x="20" y="145" fill="#eaeaea" font-size="13" opacity="0.6">☰ History</text>
  <text x="20" y="175" fill="#eaeaea" font-size="13" opacity="0.6">⊞ Leaderboards</text>
  <rect x="0" y="190" width="220" height="30" fill="rgba(233,69,96,0.2)"/>
  <rect x="0" y="190" width="3" height="30" fill="#e94560"/>
  <text x="20" y="210" fill="#eaeaea" font-size="13">⚡ Terror Zone</text>
  <text x="20" y="240" fill="#eaeaea" font-size="13" opacity="0.6">※ DClone</text>
  <line x1="10" y1="265" x2="210" y2="265" stroke="#2a2a4a" stroke-width="1"/>
  <text x="20" y="290" fill="#eaeaea" font-size="13" opacity="0.6">⚙ Settings</text>
  <!-- Main -->
  <text x="250" y="50" fill="#eaeaea" font-size="22" font-weight="bold">⚡ Terror Zone</text>
  <rect x="830" y="28" width="175" height="28" rx="4" fill="#0f3460" stroke="#2a2a4a"/>
  <text x="845" y="47" fill="#eaeaea" font-size="12">MFSorc · Sorceress</text>
  <!-- TZ Display -->
  <text x="250" y="90" fill="#eaeaea" font-size="16" font-weight="bold">Active Terror Zone</text>
  <rect x="250" y="100" width="815" height="110" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <!-- Zone name -->
  <text x="280" y="135" fill="#4ecdc4" font-size="24" font-weight="bold">Tamoe Highland and Pit</text>
  <!-- Tier badge -->
  <rect x="690" y="113" width="36" height="24" rx="4" fill="#ffd700"/>
  <text x="700" y="131" fill="#1a1a2e" font-size="14" font-weight="bold">S</text>
  <!-- Countdown -->
  <text x="280" y="165" fill="#a0a0a0" font-size="13">Next zone in:</text>
  <text x="390" y="165" fill="#ff8c00" font-size="18" font-weight="bold">47 min</text>
  <!-- Source indicator -->
  <rect x="820" y="148" width="90" height="22" rx="4" fill="rgba(78,205,196,0.15)" stroke="rgba(78,205,196,0.3)"/>
  <text x="833" y="163" fill="#4ecdc4" font-size="11">● Live API</text>
  <!-- TZ Calendar -->
  <text x="250" y="235" fill="#eaeaea" font-size="16" font-weight="bold">Upcoming Zones</text>
  <rect x="250" y="245" width="815" height="120" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <!-- Calendar rows -->
  <text x="270" y="275" fill="#a0a0a0" font-size="11">18:00 UTC</text>
  <text x="360" y="275" fill="#eaeaea" font-size="13">Outer Cloister and Barracks</text>
  <rect x="690" y="259" width="30" height="20" rx="3" fill="rgba(255,140,0,0.2)" stroke="#ff8c00"/>
  <text x="698" y="273" fill="#ff8c00" font-size="11">A</text>
  <text x="270" y="300" fill="#a0a0a0" font-size="11">19:00 UTC</text>
  <text x="360" y="300" fill="#eaeaea" font-size="13">Chaos Sanctuary</text>
  <rect x="690" y="284" width="30" height="20" rx="3" fill="rgba(255,215,0,0.2)" stroke="#ffd700"/>
  <text x="698" y="298" fill="#ffd700" font-size="11">S</text>
  <text x="270" y="325" fill="#a0a0a0" font-size="11">20:00 UTC</text>
  <text x="360" y="325" fill="#eaeaea" font-size="13">Lower Kurast</text>
  <rect x="690" y="309" width="30" height="20" rx="3" fill="rgba(255,215,0,0.2)" stroke="#ffd700"/>
  <text x="698" y="323" fill="#ffd700" font-size="11">S</text>
  <text x="270" y="350" fill="#a0a0a0" font-size="11">21:00 UTC</text>
  <text x="360" y="350" fill="#eaeaea" font-size="13">Crystalline Passage and Frozen River</text>
  <rect x="690" y="334" width="30" height="20" rx="3" fill="rgba(78,205,196,0.2)" stroke="#4ecdc4"/>
  <text x="698" y="348" fill="#4ecdc4" font-size="11">B</text>
  <!-- TZ Advisor -->
  <text x="250" y="390" fill="#eaeaea" font-size="16" font-weight="bold">TZ Advisor</text>
  <rect x="250" y="400" width="815" height="100" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="270" y="430" fill="#eaeaea" font-size="14">Tamoe Highland and Pit</text>
  <rect x="640" y="413" width="110" height="24" rx="12" fill="rgba(76,175,80,0.2)" stroke="#4caf50"/>
  <text x="665" y="430" fill="#4caf50" font-size="12">⭐ Recommended</text>
  <text x="270" y="460" fill="#a0a0a0" font-size="12">Your items/hour in this zone:</text>
  <text x="490" y="460" fill="#4caf50" font-size="14" font-weight="bold">14.2/hr</text>
  <text x="590" y="460" fill="#a0a0a0" font-size="12">vs profile avg</text>
  <text x="710" y="460" fill="#eaeaea" font-size="14">11.8/hr</text>
  <text x="270" y="484" fill="#a0a0a0" font-size="12">Based on 38 recorded runs · +20.3% above your average</text>
  <!-- Settings -->
  <text x="250" y="525" fill="#eaeaea" font-size="16" font-weight="bold">Settings</text>
  <rect x="250" y="535" width="815" height="60" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="270" y="560" fill="#a0a0a0" font-size="12">API Polling</text>
  <rect x="370" y="543" width="50" height="24" rx="12" fill="#4caf50"/>
  <circle cx="408" cy="555" r="10" fill="white"/>
  <text x="440" y="560" fill="#a0a0a0" font-size="12">Good TZ Threshold</text>
  <rect x="600" y="543" width="60" height="24" rx="4" fill="#1a1a2e" stroke="#2a2a4a"/>
  <text x="617" y="560" fill="#eaeaea" font-size="12">A tier</text>
</svg>
