<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!-- Background -->
  <rect width="1100" height="700" fill="#1a1a2e"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="700" fill="#0f3460"/>
  <text x="20" y="38" fill="#e94560" font-size="16" font-weight="bold">D2R Tracker</text>
  <line x1="0" y1="60" x2="220" y2="60" stroke="#2a2a4a" stroke-width="1"/>
  <text x="20" y="85" fill="#eaeaea" font-size="13" opacity="0.6">◎ Profiles</text>
  <text x="20" y="115" fill="#eaeaea" font-size="13" opacity="0.6">▶ Run Tracker</text>
  <text x="20" y="145" fill="#eaeaea" font-size="13" opacity="0.6">☰ History</text>
  <text x="20" y="175" fill="#eaeaea" font-size="13" opacity="0.6">⊞ Leaderboards</text>
  <rect x="0" y="190" width="220" height="30" fill="rgba(233,69,96,0.2)"/>
  <rect x="0" y="190" width="3" height="30" fill="#e94560"/>
  <text x="20" y="210" fill="#eaeaea" font-size="13">∇ Terror Zone</text>
  <text x="20" y="240" fill="#eaeaea" font-size="13" opacity="0.6">※ DClone</text>
  <line x1="10" y1="260" x2="210" y2="260" stroke="#2a2a4a" stroke-width="1"/>
  <text x="20" y="285" fill="#eaeaea" font-size="13" opacity="0.6">⚙ Settings</text>

  <!-- Main content -->
  <text x="250" y="50" fill="#eaeaea" font-size="22" font-weight="bold">∇ Terror Zone</text>
  <rect x="830" y="28" width="175" height="28" rx="4" fill="#0f3460" stroke="#2a2a4a"/>
  <text x="845" y="47" fill="#eaeaea" font-size="12">MFSorc · Sorceress</text>

  <!-- TZ Display -->
  <text x="250" y="90" fill="#eaeaea" font-size="16" font-weight="bold">Current Terror Zone</text>
  <rect x="250" y="100" width="815" height="110" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="280" y="135" fill="#4ecdc4" font-size="24" font-weight="bold">Tamoe Highland and Pit</text>
  <rect x="700" y="113" width="36" height="24" rx="4" fill="#ffd700"/>
  <text x="710" y="131" fill="#1a1a2e" font-size="14" font-weight="bold">S</text>
  <text x="280" y="162" fill="#a0a0a0" font-size="13">Next rotation in:</text>
  <text x="395" y="162" fill="#ff8c00" font-size="18" font-weight="bold">47 min</text>
  <rect x="820" y="145" width="105" height="22" rx="4" fill="rgba(78,205,196,0.15)" stroke="rgba(78,205,196,0.3)"/>
  <text x="833" y="160" fill="#4ecdc4" font-size="11">● Live API</text>
  <text x="280" y="196" fill="#888" font-size="10">d2r.kimpton.io/api/tz · updates on hourly boundary</text>

  <!-- Upcoming Zones -->
  <text x="250" y="235" fill="#eaeaea" font-size="16" font-weight="bold">Upcoming Zones</text>
  <rect x="250" y="245" width="815" height="130" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <rect x="250" y="245" width="815" height="28" rx="8" fill="#0f3460"/>
  <text x="270" y="264" fill="#a0a0a0" font-size="12" font-weight="bold">Zone</text>
  <text x="680" y="264" fill="#a0a0a0" font-size="12" font-weight="bold">Tier</text>
  <text x="780" y="264" fill="#a0a0a0" font-size="12" font-weight="bold">Active At (UTC)</text>
  <text x="270" y="293" fill="#eaeaea" font-size="13">Outer Cloister and Barracks</text>
  <rect x="680" y="278" width="28" height="18" rx="3" fill="rgba(255,140,0,0.2)" stroke="#ff8c00"/>
  <text x="689" y="291" fill="#ff8c00" font-size="11">A</text>
  <text x="780" y="293" fill="#a0a0a0" font-size="12">18:00 UTC</text>
  <text x="270" y="316" fill="#eaeaea" font-size="13">Chaos Sanctuary</text>
  <rect x="680" y="301" width="28" height="18" rx="3" fill="rgba(255,215,0,0.2)" stroke="#ffd700"/>
  <text x="689" y="314" fill="#ffd700" font-size="11">S</text>
  <text x="780" y="316" fill="#a0a0a0" font-size="12">19:00 UTC</text>
  <text x="270" y="339" fill="#eaeaea" font-size="13">Lower Kurast</text>
  <rect x="680" y="324" width="28" height="18" rx="3" fill="rgba(255,215,0,0.2)" stroke="#ffd700"/>
  <text x="689" y="337" fill="#ffd700" font-size="11">S</text>
  <text x="780" y="339" fill="#a0a0a0" font-size="12">20:00 UTC</text>
  <text x="270" y="362" fill="#eaeaea" font-size="13">Crystalline Passage and Frozen River</text>
  <rect x="680" y="347" width="28" height="18" rx="3" fill="rgba(78,205,196,0.2)" stroke="#4ecdc4"/>
  <text x="689" y="360" fill="#4ecdc4" font-size="11">B</text>
  <text x="780" y="362" fill="#a0a0a0" font-size="12">21:00 UTC</text>

  <!-- TZ Advisor -->
  <text x="250" y="400" fill="#eaeaea" font-size="16" font-weight="bold">Your TZ Performance</text>
  <rect x="250" y="410" width="815" height="90" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="270" y="438" fill="#eaeaea" font-size="14">Tamoe Highland and Pit</text>
  <rect x="640" y="421" width="110" height="22" rx="11" fill="rgba(76,175,80,0.2)" stroke="#4caf50"/>
  <text x="663" y="436" fill="#4caf50" font-size="12">✓ Recommended</text>
  <text x="270" y="463" fill="#a0a0a0" font-size="12">Items/hr in this zone:</text>
  <text x="405" y="463" fill="#4caf50" font-size="14" font-weight="bold">14.2</text>
  <text x="435" y="463" fill="#a0a0a0" font-size="12"> vs profile avg </text>
  <text x="545" y="463" fill="#eaeaea" font-size="14">11.8</text>
  <text x="270" y="486" fill="#a0a0a0" font-size="11">Based on 38 runs · +20.3% above average</text>

  <!-- Settings -->
  <text x="250" y="525" fill="#eaeaea" font-size="16" font-weight="bold">Settings</text>
  <rect x="250" y="535" width="815" height="60" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <text x="270" y="558" fill="#a0a0a0" font-size="12">API Polling</text>
  <rect x="350" y="543" width="50" height="22" rx="11" fill="#4caf50"/>
  <circle cx="388" cy="554" r="9" fill="white"/>
  <text x="415" y="558" fill="#a0a0a0" font-size="12">Good TZ Threshold</text>
  <rect x="560" y="543" width="60" height="22" rx="4" fill="#1a1a2e" stroke="#2a2a4a"/>
  <text x="572" y="558" fill="#eaeaea" font-size="12">A tier</text>
  <text x="270" y="584" fill="#888" font-size="10">Offline: uses deterministic UTC-based SP rotation when API is unavailable</text>
</svg>
